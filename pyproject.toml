[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-rul"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "torch>=2.11.0",
    "tqdm",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]